name: Validate and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:release
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ls --omit=dev --depth=0

  release:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:release -- "$RELEASE_TAG"
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Verify tag matches plugin version
        run: node -e "const manifest=require('./manifest.json'); if (process.env.RELEASE_TAG !== manifest.version) throw new Error('Tag must exactly match manifest version')"
      - name: Package runtime and notices
        run: |
          mkdir -p ../release
          cp main.js manifest.json styles.css ../LICENSE ../THIRD_PARTY_NOTICES.md ../release/
          cd ../release
          touch -t 198001010000 main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md
          zip -X "academic-dashboard-${RELEASE_TAG}.zip" main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md
          sha256sum main.js manifest.json styles.css "academic-dashboard-${RELEASE_TAG}.zip" > SHA256SUMS
      - name: Create GitHub release
        working-directory: .
        run: |
          gh release create "$RELEASE_TAG" \
            release/main.js release/manifest.json release/styles.css \
            "release/academic-dashboard-${RELEASE_TAG}.zip" release/SHA256SUMS \
            --verify-tag --generate-notes --title "Academic Dashboard ${RELEASE_TAG}"
